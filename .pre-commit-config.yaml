# Hooks for prek (https://github.com/j178/prek) or pre-commit: `prek install` sets up all three stages.
# The denylist is read from outside the repository (see kilotronic/data-leak-check's README).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/kilotronic/data-leak-check
    rev: f1da8a7ce76bfaabd70ea815d9417fb691e95799  # v1.1.0
    hooks:
      - id: data-leak-check            # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push   # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/secret-scan
    rev: 814f89d661368214fc3fedb2bd583bef835a17cd  # v1.2.0
    hooks:
      - id: secret-scan                # pre-commit: the staged changes
      - id: secret-scan-push           # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/lint
    rev: 50d58c6fc3916432a60d6caf5914d5bb83a60a16  # v1.1.0
    hooks:
      - id: shellcheck
      - id: actionlint
      - id: pinned
  - repo: https://github.com/kilotronic/git-identity
    rev: ef36d47c998b7a247ac75d36f3e1ba56eb22b4ea  # v2.3.0
    hooks:
      - id: git-identity
        args: ["--domain=ixid.net,kilotronic.com"] # quoted: a bare comma would split the list
        fail_fast: true
