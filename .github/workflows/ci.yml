name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dogfood-action:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Reviewer
      GIT_AUTHOR_EMAIL: reviewer@kilotronic.com
      GIT_COMMITTER_NAME: Reviewer
      GIT_COMMITTER_EMAIL: reviewer@kilotronic.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./

  dogfood-refuse:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: test
      GIT_AUTHOR_EMAIL: test@example.com
      GIT_COMMITTER_NAME: test
      GIT_COMMITTER_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: gate
        continue-on-error: true
      - name: Gate must refuse placeholders
        run: test "${{ steps.gate.outcome }}" = "failure"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, dogfood-action, dogfood-refuse]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.dogfood-action.result }}" != "success" ] \
            || [ "${{ needs.dogfood-refuse.result }}" != "success" ]; then
            echo "A required job did not succeed (test=${{ needs.test.result }}, dogfood-action=${{ needs.dogfood-action.result }}, dogfood-refuse=${{ needs.dogfood-refuse.result }})"
            exit 1
          fi
          echo "All required jobs succeeded."
