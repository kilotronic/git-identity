name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dogfood-action:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Reviewer
      GIT_AUTHOR_EMAIL: reviewer@kilotronic.com
      GIT_COMMITTER_NAME: Reviewer
      GIT_COMMITTER_EMAIL: reviewer@kilotronic.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          commits: identity
      - uses: ./
        with:
          commits: identity
          domains: ixid.net, kilotronic.com

  dogfood-refuse:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: test
      GIT_AUTHOR_EMAIL: test@example.com
      GIT_COMMITTER_NAME: test
      GIT_COMMITTER_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: gate
        continue-on-error: true
        with:
          commits: identity
      - name: Gate must refuse placeholders
        run: test "${{ steps.gate.outcome }}" = "failure"

  dogfood-refuse-domain:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Reviewer
      GIT_AUTHOR_EMAIL: reviewer@kilotronic.com
      GIT_COMMITTER_NAME: Reviewer
      GIT_COMMITTER_EMAIL: reviewer@kilotronic.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: wrong
        continue-on-error: true
        with:
          commits: identity
          domains: ixid.net
      - name: Gate must refuse an email outside the domain
        run: test "${{ steps.wrong.outcome }}" = "failure"

  dogfood-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Default mode: this PR's or push's own commits (placeholder and machine-default checks only).
      - uses: ./
      # Range mode: a fresh commit with a machine-default email must be refused, a real one accepted.
      - name: Make a good and a bad commit
        run: |
          GIT_AUTHOR_NAME=Ada GIT_AUTHOR_EMAIL=ada@kilotronic.com GIT_COMMITTER_NAME=Ada \
            GIT_COMMITTER_EMAIL=ada@kilotronic.com git commit -q --allow-empty -m good
          GIT_AUTHOR_NAME=Jay GIT_AUTHOR_EMAIL=jay@Jays-MacBook-Pro.local GIT_COMMITTER_NAME=Jay \
            GIT_COMMITTER_EMAIL=jay@Jays-MacBook-Pro.local git commit -q --allow-empty -m bad
      - uses: ./
        with:
          commits: HEAD~2..HEAD~1
          domains: kilotronic.com
      - uses: ./
        id: bad
        continue-on-error: true
        with:
          commits: HEAD~1..HEAD
      - name: Gate must refuse a machine-default author
        run: test "${{ steps.bad.outcome }}" = "failure"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, dogfood-action, dogfood-refuse, dogfood-refuse-domain, dogfood-commits]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.dogfood-action.result }}" != "success" ] \
            || [ "${{ needs.dogfood-refuse.result }}" != "success" ] \
            || [ "${{ needs.dogfood-refuse-domain.result }}" != "success" ] \
            || [ "${{ needs.dogfood-commits.result }}" != "success" ]; then
            echo "A required job did not succeed (test=${{ needs.test.result }}, dogfood-action=${{ needs.dogfood-action.result }}, dogfood-refuse=${{ needs.dogfood-refuse.result }}, dogfood-refuse-domain=${{ needs.dogfood-refuse-domain.result }}, dogfood-commits=${{ needs.dogfood-commits.result }})"
            exit 1
          fi
          echo "All required jobs succeeded."
