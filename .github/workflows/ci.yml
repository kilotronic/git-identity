name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # v1.2.1

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/lint@b5343bfa69d890919c8774733da372d13d23d6d3 # v1.3.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dogfood-action:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Reviewer
      GIT_AUTHOR_EMAIL: reviewer@kilotronic.com
      GIT_COMMITTER_NAME: Reviewer
      GIT_COMMITTER_EMAIL: reviewer@kilotronic.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        with:
          commits: identity
      - uses: ./
        with:
          commits: identity
          domains: ixid.net, kilotronic.com

  dogfood-refuse:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: test
      GIT_AUTHOR_EMAIL: test@example.com
      GIT_COMMITTER_NAME: test
      GIT_COMMITTER_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        id: gate
        continue-on-error: true
        with:
          commits: identity
      - name: Gate must refuse placeholders
        run: test "${{ steps.gate.outcome }}" = "failure"

  dogfood-refuse-domain:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Reviewer
      GIT_AUTHOR_EMAIL: reviewer@kilotronic.com
      GIT_COMMITTER_NAME: Reviewer
      GIT_COMMITTER_EMAIL: reviewer@kilotronic.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        id: wrong
        continue-on-error: true
        with:
          commits: identity
          domains: ixid.net
      - name: Gate must refuse an email outside the domain
        run: test "${{ steps.wrong.outcome }}" = "failure"

  dogfood-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allow-bots on a push asks which pull request a commit merged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Default mode: this PR's or push's own commits (placeholder and machine-default checks, and each
      # subject reads `<type>: <imperative>`).
      - uses: ./
        with:
          commit-subject: true
      # allow-bots must not change the outcome for commits that are not a bot's own update.
      - uses: ./
        with:
          allow-bots: dependabot, renovate
      # Range mode: a fresh commit with a machine-default email must be refused, a real one accepted.
      - name: Make a good and a bad commit
        run: |
          GIT_AUTHOR_NAME=Ada GIT_AUTHOR_EMAIL=ada@kilotronic.com GIT_COMMITTER_NAME=Ada \
            GIT_COMMITTER_EMAIL=ada@kilotronic.com git commit -q --allow-empty -m good
          GIT_AUTHOR_NAME=Jay GIT_AUTHOR_EMAIL=jay@Jays-MacBook-Pro.local GIT_COMMITTER_NAME=Jay \
            GIT_COMMITTER_EMAIL=jay@Jays-MacBook-Pro.local git commit -q --allow-empty -m bad
      - uses: ./
        with:
          commits: HEAD~2..HEAD~1
          domains: kilotronic.com
      - uses: ./
        id: bad
        continue-on-error: true
        with:
          commits: HEAD~1..HEAD
      - name: Gate must refuse a machine-default author
        run: test "${{ steps.bad.outcome }}" = "failure"

  # The prek hook, from this checkout: a real identity passes, a placeholder is refused.
  prek-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install prek==0.5.11
      - name: prek try-repo with a good and a bad identity
        run: |
          hooks="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)" && git init -q
          echo hello > a.txt && git add a.txt
          GIT_AUTHOR_NAME=Ada GIT_AUTHOR_EMAIL=ada@kilotronic.com GIT_COMMITTER_NAME=Ada \
            GIT_COMMITTER_EMAIL=ada@kilotronic.com prek try-repo "$hooks" git-identity
          if GIT_AUTHOR_NAME=test GIT_AUTHOR_EMAIL=test@example.com GIT_COMMITTER_NAME=test \
            GIT_COMMITTER_EMAIL=test@example.com prek try-repo "$hooks" git-identity; then
            echo "::error::the placeholder identity was not refused"; exit 1
          fi
      - name: prek try-repo with good and bad commit messages
        run: |
          hooks="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)" && git init -q
          printf 'feat: add x\n' > good && printf 'added x\n' > bad
          printf 'feat: add x\n\nClaude-%s: https://example.test/s1\n' Session > session
          msg() { prek try-repo "$hooks" "$1" --stage commit-msg --commit-msg-filename "$2"; }
          msg commit-subject good
          if msg commit-subject bad; then echo "::error::a bad subject was not refused"; exit 1; fi
          KILOTRONIC_VISIBILITY=private msg session-trailer session
          if KILOTRONIC_VISIBILITY=public msg session-trailer session; then
            echo "::error::a Claude-Session trailer in a public repository was not refused"; exit 1
          fi

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        test,
        secret-scan,
        lint,
        dogfood-action,
        dogfood-refuse,
        dogfood-refuse-domain,
        dogfood-commits,
        prek-hook,
        data-leak-check,
        prek,
      ]
    if: always()
    steps:
      # Every job in needs: is checked and must succeed, so a new job only has to be added there.
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" = success ]] || exit 1
          done
